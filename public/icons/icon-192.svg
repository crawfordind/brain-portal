<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <rect width="192" height="192" rx="42" fill="url(#glow)"/>
  <!-- Brain outline with circuit aesthetic -->
  <g transform="translate(96,92)" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left hemisphere -->
    <path d="M-6,-38 C-24,-38 -40,-28 -44,-12 C-48,4 -42,18 -32,26 C-26,31 -20,38 -16,44 L-6,44" opacity="0.95"/>
    <path d="M-44,-12 C-52,-8 -56,2 -52,12" opacity="0.7"/>
    <path d="M-32,26 C-40,24 -48,16 -48,8" opacity="0.7"/>
    <!-- Right hemisphere -->
    <path d="M6,-38 C24,-38 40,-28 44,-12 C48,4 42,18 32,26 C26,31 20,38 16,44 L6,44" opacity="0.95"/>
    <path d="M44,-12 C52,-8 56,2 52,12" opacity="0.7"/>
    <path d="M32,26 C40,24 48,16 48,8" opacity="0.7"/>
    <!-- Central fissure -->
    <line x1="0" y1="-38" x2="0" y2="44" opacity="0.4"/>
    <!-- Neural nodes -->
    <circle cx="-20" cy="-18" r="3.5" fill="#5eead4" stroke="none" opacity="0.9"/>
    <circle cx="20" cy="-18" r="3.5" fill="#5eead4" stroke="none" opacity="0.9"/>
    <circle cx="-14" cy="8" r="3" fill="#5eead4" stroke="none" opacity="0.7"/>
    <circle cx="14" cy="8" r="3" fill="#5eead4" stroke="none" opacity="0.7"/>
    <circle cx="0" cy="-8" r="4" fill="#99f6e4" stroke="none" opacity="0.9"/>
    <!-- Circuit connections between nodes -->
    <line x1="-20" y1="-18" x2="0" y2="-8" stroke="#5eead4" stroke-width="1.5" opacity="0.5"/>
    <line x1="20" y1="-18" x2="0" y2="-8" stroke="#5eead4" stroke-width="1.5" opacity="0.5"/>
    <line x1="-14" y1="8" x2="0" y2="-8" stroke="#5eead4" stroke-width="1.5" opacity="0.4"/>
    <line x1="14" y1="8" x2="0" y2="-8" stroke="#5eead4" stroke-width="1.5" opacity="0.4"/>
    <line x1="-20" y1="-18" x2="-14" y2="8" stroke="#5eead4" stroke-width="1.5" opacity="0.3"/>
    <line x1="20" y1="-18" x2="14" y2="8" stroke="#5eead4" stroke-width="1.5" opacity="0.3"/>
  </g>
  <!-- Stem -->
  <rect x="84" y="136" width="24" height="8" rx="4" fill="#fff" opacity="0.6"/>
