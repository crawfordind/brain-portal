name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR cancels the run still in flight for it. Reviewers care
# about the latest commit, not about a queue of superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # No secrets are needed and none are exposed: the build only has to prove
      # the code compiles, and `scripts/migrate.ts` skips itself when CI=true
      # rather than failing for want of a database.
      CI: "true"
      SKIP_MIGRATIONS: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Each step runs even if an earlier one failed, so a pull request gets
      # every problem in one report instead of one per push.
      - name: Lint
        if: always()
        run: npm run lint

      - name: Typecheck
        if: always()
        run: npm run typecheck

      - name: Test
        if: always()
        run: npm test

      - name: Build
        if: always()
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Blocks on high or critical advisories in what ships: the production
      # dependency tree. Moderate advisories should not block a documentation fix.
      - name: npm audit (production dependencies)
        run: npm audit --audit-level=high --omit=dev
      # Dev-only tooling (linters, test runners) never reaches a deployment, and
      # some of its advisories have no patched release at all (e.g. `braces`
      # under eslint-config-next). Reported here so they stay visible, but they
      # do not fail the build.
      - name: npm audit (all dependencies, informational)
        run: npm audit --audit-level=high || echo "::warning::Dev-only dependencies have open advisories; see the log above."
